[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat-based home-service errand agent with code-enforced approvals"
readme = "README.md"
authors = [
    { name = "Vaibhav Bisht", email = "vaibhavbisht592@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-ai-slim[anthropic,openai]>=2.66.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" so async tests don't each need @pytest.mark.asyncio
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# Bug-repro commits use xfail(strict=True); make strict the default so an
# unexpectedly passing repro fails the run instead of silently passing.
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
